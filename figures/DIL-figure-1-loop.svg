<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f8a"/></marker></defs>
<rect x="8" y="8" width="604" height="414" rx="18" fill="#fbf4df" stroke="#a87a12" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="310.0" y="34" text-anchor="middle" font-size="14" font-weight="bold" fill="#a87a12">Global modulatory field (GLOB-MOD)</text>
<text x="310.0" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#a87a12">a field condition with no position in the chain; it conditions how every link interprets</text>
