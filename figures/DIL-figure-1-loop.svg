<text x="158.4" y="172.5" text-anchor="middle" font-size="14" fill="#1a1a1a">(6) Feedback</text>
<text x="310" y="234" text-anchor="middle" font-size="13" font-style="italic" fill="#2f5f8a">closed cycle</text>
<text x="310" y="251" text-anchor="middle" font-size="13" font-style="italic" fill="#2f5f8a">(INV-1)</text>
