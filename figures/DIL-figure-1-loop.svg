<line x1="258.0" y1="354.0" x2="214.7" y2="334.0" stroke="#2f5f8a" stroke-width="1.8" marker-end="url(#b)"/>
<line x1="158.4" y1="284.0" x2="158.4" y2="194.0" stroke="#2f5f8a" stroke-width="1.8" marker-end="url(#b)"/>
<line x1="210.4" y1="144.0" x2="253.7" y2="124.0" stroke="#2f5f8a" stroke-width="1.8" marker-end="url(#b)"/>
<rect x="228.0" y="78.0" width="164" height="40" rx="8" fill="#fff" stroke="#2f5f8a" stroke-width="1.4"/>
<text x="310.0" y="102.5" text-anchor="middle" font-size="14" fill="#1a1a1a">(1) Ingest</text>
