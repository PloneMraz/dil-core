<text x="461.6" y="172.5" text-anchor="middle" font-size="14" fill="#1a1a1a">(2) Differentiate source</text>
<rect x="379.6" y="288.0" width="164" height="40" rx="8" fill="#fff" stroke="#2f5f8a" stroke-width="1.4"/>
<text x="461.6" y="312.5" text-anchor="middle" font-size="14" fill="#1a1a1a">(3) Integrate</text>
